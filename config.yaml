# voicx server configuration sample.
# The loader searches for config.yaml in the working directory first, then in
# /etc/voicx. Environment variables prefixed with VOICX_ override these values
# (e.g. VOICX_TCP_ADDR=:12333). See .env.example for the full list of supported
# environment variables.

server_name: voicx
server_password: ""  # global server password; empty = open server (hashed at startup)
log_level: info        # debug | info | warn | error
dev_mode: true        # true = development logger (console), false = production (JSON)

tcp_addr: ":12333"    # TLS control channel
udp_addr: ":12334"    # UDP keepalive/media support
udp_rate_limit_pps: 200   # per-source-IP UDP rate limit (pkt/s); 0 = disabled
udp_rate_burst: 400       # per-source-IP UDP burst allowance
grpc_addr: "127.0.0.1:12338"   # plaintext gRPC is restricted to loopback
health_addr: ":12337"  # health/readiness HTTP endpoint (/healthz, /readyz)
query_addr: ":12335"  # ServerQuery (admin/bot text protocol)
# ServerQuery over SSH (224): same commands and credentials as query_addr.
query_ssh_enabled: false
query_ssh_addr: ":12339"
query_ssh_host_key: "./data/keys/query_ssh_host.key"  # generated once; keep it, or clients see a changed host key

# File transfer (token-authorized uploads/downloads on its own port).
file_addr: ":12336"
file_root: "./data/files"     # on-disk layout: <channel_id>/<name>
file_max_kbps: 0              # per-connection bandwidth cap in KiB/s; 0 = unlimited
file_channel_quota_mb: 0      # per-channel total file quota in MiB; 0 = unlimited
file_max_size_mb: 100         # per-transfer size cap in MiB; 0 = unlimited
file_quiet_hours_start: 0      # local hour 0..23; equal start/end disables
file_quiet_hours_end: 0

database_url: "postgres://voicx:voicx@localhost:5432/voicx?sslmode=disable"
pii_key_file: "./data/keys/pii.key"  # generated once, outside PostgreSQL
redis_addr: "localhost:6379"
redis_password: ""
redis_enabled: true   # false = skip Redis entirely (server runs without it)

max_clients: 1024
client_timeout_seconds: 90
default_opus_bitrate: 32000
default_opus_fec: true
default_opus_dtx: false
default_opus_stereo: false

# Database connection pool tuning.
db_max_open_conns: 25
db_max_idle_conns: 5
db_conn_max_lifetime: 30m

# Echo test channel (15): ensured to exist at startup; publishers in it hear
# their own audio routed back. Empty disables the echo channel.
echo_channel_name: "Echo Test"

# TLS for the TCP control channel (wave 4a). Enabled by default. With empty
# cert/key files a self-signed ECDSA P-256 certificate (10y, SANs localhost +
# server name) is generated into tls_dir on first start and reused after —
# clients pin its SHA-256 fingerprint (TOFU), which is logged at startup and
# sent in the auth response. tls_enabled: false is a dev/e2e escape hatch.
# ServerQuery and file-transfer ports stay plaintext (backlog 225).
tls_enabled: true
tls_dir: "./data/tls"
tls_cert_file: ""
tls_key_file: ""

# Chat payload encryption (wave 4b). Plaintext chat is rejected by default;
# allow_plaintext is a dev escape hatch for old clients.
chat_allow_plaintext: false

# Chat moderation & limits (wave 5a). max_length is in plaintext characters
# post-decrypt. rate = per-user token bucket. word/link filters apply to
# channel/global scopes only (DMs are E2EE, exempt). whitelist non-empty =
# ONLY those domains may be linked.
chat_max_length: 4096
chat_rate_msgs: 5
chat_rate_window_seconds: 3
chat_word_filter: ""
chat_link_blacklist: ""
chat_link_whitelist: ""

# TURN server for NAT traversal (445/446). Only needed for clients behind
# restrictive NATs. Set secret to the coturn static-auth-secret (see the
# "turn" profile in docker-compose.yml); clients then receive time-limited
# REST API credentials in their auth response.
turn:
  secret: ""
  realm: "voicx"
  uris: []           # e.g. ["turn:turn.example.com:12340?transport=udp"]
  credentials_ttl: 24h

# WebRTC (Pion) engine configuration.
# ice_servers: STUN/TURN URLs used when creating peer connections. If empty,
#   the engine falls back to "stun:stun.l.google.com:19302".
# enable_av1: register the AV1 video codec (optional; not all clients support it).
webrtc:
  ice_servers:
    - "stun:stun.l.google.com:19302"
  enable_av1: false

# Server-side stream recording via an ffmpeg subprocess (see internal/recorder).
# Disabled by default. video_args/audio_args are the ffmpeg output options;
# set e.g. ["-c:v", "h264_nvenc"] (NVIDIA), ["-c:v", "h264_qsv"] (Intel), or
# ["-c:v", "h264_vaapi"] (AMD/Intel Linux) for hardware encoding.
recording:
  enabled: false
  dir: recordings
  ffmpeg_path: ffmpeg
  format: webm
  video_args: ["-c:v", "copy"]
  audio_args: ["-c:a", "copy"]
