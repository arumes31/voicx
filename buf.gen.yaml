# buf.gen.yaml drives reproducible remote-plugin generation for the Go stubs
# (232). Plugin versions are pinned here; no local protoc-gen-* binaries are
# required.
version: v2
managed:
  enabled: false
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .
    opt: module=voicx
  - remote: buf.build/grpc/go:v1.5.1
    out: .
    opt: module=voicx
inputs:
  - directory: proto
