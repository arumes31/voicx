name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
        env:
          POSTGRES_USER: voicx
          POSTGRES_PASSWORD: voicx
          POSTGRES_DB: voicx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicx -d voicx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: install linux client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev xvfb

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt issues in:"; echo "$fmt"; exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          (cd client && go vet ./...)

      - name: build
        run: |
          go build ./...
          (cd client && go build ./...)

      - name: test and enforce coverage
        run: |
          root_coverage="$RUNNER_TEMP/root-unit.out"
          go test -race -count=1 -covermode=atomic -coverprofile="$root_coverage" ./internal/...
          go test -race -count=1 . ./cmd/... ./v1
          root_pct="$(go tool cover -func="$root_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$root_pct" 'BEGIN {
            minimum = 70
            if (got + 0 < minimum) {
              printf "root internal coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          client_coverage="$RUNNER_TEMP/client-unit.out"
          (cd client && xvfb-run -a go test -race -count=1 -covermode=atomic -coverprofile="$client_coverage" ./...)
          client_pct="$(cd client && go tool cover -func="$client_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$client_pct" 'BEGIN {
            minimum = 50
            if (got + 0 < minimum) {
              printf "client coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          printf "root internal coverage: %s%%\nclient coverage: %s%%\n" "$root_pct" "$client_pct"
        env:
          VOICX_TEST_DATABASE_URL: postgres://voicx:voicx@localhost:5432/voicx?sslmode=disable
          VOICX_REDIS_ADDR: localhost:6379

      - name: upload coverage profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            ${{ runner.temp }}/root-unit.out
            ${{ runner.temp }}/client-unit.out

  docker:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VOICX_UPDATE_PUBLIC_KEYS: ${{ vars.VOICX_UPDATE_PUBLIC_KEYS }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: compute version metadata
        shell: bash
        run: |
          echo "VOICX_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VOICX_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VOICX_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "VOICX_DIRTY=false" >> "$GITHUB_ENV"

      - name: validate update signing configuration
        shell: bash
        env:
          VOICX_UPDATE_SIGNING_KEY: ${{ secrets.VOICX_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$VOICX_UPDATE_PUBLIC_KEYS" || {
            echo "repository variable VOICX_UPDATE_PUBLIC_KEYS is required" >&2
            exit 1
          }
          test -n "$VOICX_UPDATE_SIGNING_KEY" || {
            echo "repository secret VOICX_UPDATE_SIGNING_KEY is required" >&2
            exit 1
          }

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: build client (windows/amd64)
        shell: bash
        working-directory: client
        run: |
          wails build -ldflags "-s -w \
            -X voicx/internal/version.Version=${{ github.ref_name }} \
            -X voicx/internal/version.Build=${{ env.VOICX_BUILD }} \
            -X voicx/internal/version.Commit=${{ env.VOICX_COMMIT }} \
            -X voicx/internal/version.BuildDate=${{ env.VOICX_BUILD_DATE }} \
            -X voicx/internal/version.Dirty=${{ env.VOICX_DIRTY }} \
            -X voicx/internal/version.UpdateRepo=${{ github.repository }} \
            -X voicx/internal/version.UpdatePublicKeys=${{ env.VOICX_UPDATE_PUBLIC_KEYS }}"

      - name: build server (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X voicx/internal/version.Version=${{ github.ref_name }} \
              -X voicx/internal/version.Build=${{ env.VOICX_BUILD }} \
              -X voicx/internal/version.Commit=${{ env.VOICX_COMMIT }} \
              -X voicx/internal/version.BuildDate=${{ env.VOICX_BUILD_DATE }} \
              -X voicx/internal/version.Dirty=${{ env.VOICX_DIRTY }} \
              -X voicx/internal/version.UpdateRepo=${{ github.repository }}" \
            -o voicx-server-linux-amd64 ./cmd/server

      - name: checksums
        shell: bash
        run: |
          cp client/build/bin/voicx-client.exe voicx-client-windows-amd64.exe
          printf '# voicx-version: %s\n' "$GITHUB_REF_NAME" > checksums.txt
          sha256sum voicx-client-windows-amd64.exe voicx-server-linux-amd64 >> checksums.txt
          cat checksums.txt

      - name: sign update manifest
        shell: bash
        env:
          VOICX_UPDATE_SIGNING_KEY: ${{ secrets.VOICX_UPDATE_SIGNING_KEY }}
        run: go run ./cmd/signrelease -in checksums.txt -out checksums.txt.sig

      - name: upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            voicx-client-windows-amd64.exe
            voicx-server-linux-amd64
            checksums.txt
            checksums.txt.sig
