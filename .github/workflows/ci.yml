name: CI

on:
  push:
  pull_request:
    # Label changes must rerun the visible, reviewable one-time breaking skip.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-contract:
    name: Proto contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Breaking-change checks compare the exact PR base SHA, so shallow
      # history is not sufficient.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned official Buf action, used only to install the exact CLI. The
      # individual checks below remain visible in the CI log.
      - name: Set up Buf 1.72.0
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true
          version: 1.72.0

      - name: verify proto-contract policy scope
        run: bash scripts/verify-proto-contract.sh

      - name: lint protobuf contracts
        run: buf lint

      - name: regenerate committed Go protobuf stubs
        run: |
          buf generate
          if [[ -n "$(git status --porcelain --untracked-files=all -- v1)" ]]; then
            echo "generated protobuf stubs under v1 are not clean"
            git status --porcelain --untracked-files=all -- v1
            exit 1
          fi

      - name: test generated protobuf contracts
        run: >-
          go test ./internal/grpcserver -run
          '^(TestGeneratedServiceContracts|TestGeneratedAuthenticationReservationContracts|TestUserBannedEventChannelFieldContract|TestChannelDeletedEventIncludesDeleteReason)$'

      - name: check protobuf breaking changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        run: >-
          buf breaking --against
          "${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }}"

      - name: record approved breaking-check skip
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        run: |
          echo "::warning::Buf breaking check skipped because this PR has the explicit 'buf skip breaking' label."
          echo "Remove the label to rerun breaking-change detection against ${{ github.event.pull_request.base.sha }}."

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e

  client-windows:
    name: Client Windows validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: test client
        working-directory: client
        run: go test -count=1 ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
        env:
          POSTGRES_USER: voicx
          POSTGRES_PASSWORD: voicx
          POSTGRES_DB: voicx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicx -d voicx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: install linux client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev postgresql-client xvfb

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: verify version metadata
        run: go run ./cmd/version -check

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt issues in:"; echo "$fmt"; exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          (cd client && go vet ./...)

      - name: build
        run: |
          go build ./...
          (cd client && go build ./...)

      - name: benchmark smoke
        run: go test -count=1 -run '^$' -bench=. -benchtime=1x ./internal/netproto ./internal/chatcrypto ./internal/permissions ./internal/filetransfer

      - name: test and enforce coverage
        run: |
          root_coverage="$RUNNER_TEMP/root-unit.out"
          go test -race -count=1 -covermode=atomic -coverprofile="$root_coverage" ./internal/...
          go test -race -count=1 ./cmd/... ./v1
          root_pct="$(go tool cover -func="$root_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$root_pct" 'BEGIN {
            minimum = 70
            if (got + 0 < minimum) {
              printf "root internal coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          client_coverage="$RUNNER_TEMP/client-unit.out"
          (cd client && xvfb-run -a go test -race -count=1 -covermode=atomic -coverprofile="$client_coverage" ./...)
          client_pct="$(cd client && go tool cover -func="$client_coverage" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v got="$client_pct" 'BEGIN {
            minimum = 50
            if (got + 0 < minimum) {
              printf "client coverage %.1f%% is below %.1f%%\n", got, minimum
              exit 1
            }
          }'

          printf "root internal coverage: %s%%\nclient coverage: %s%%\n" "$root_pct" "$client_pct"
        env:
          VOICX_TEST_DATABASE_URL: postgres://voicx:voicx@localhost:5432/voicx?sslmode=disable
          VOICX_REDIS_ADDR: localhost:6379

      - name: upload coverage profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            ${{ runner.temp }}/root-unit.out
            ${{ runner.temp }}/client-unit.out

      - name: verify database backup and restore
        shell: bash
        env:
          PGHOST: localhost
          PGUSER: voicx
          PGPASSWORD: voicx
          VOICX_DEV_MODE: "true"
        run: |
          set -euo pipefail
          source_db="voicx_backup_source"
          restore_db="voicx_backup_restore"
          backup="$RUNNER_TEMP/voicx-backup.pgdump"
          cleanup() {
            dropdb --if-exists --force "$source_db"
            dropdb --if-exists --force "$restore_db"
          }
          trap cleanup EXIT
          cleanup
          createdb "$source_db"
          VOICX_DATABASE_URL="postgres://voicx:voicx@localhost:5432/$source_db?sslmode=disable" \
            go run ./cmd/migrate -timeout 2m
          pg_dump --format=custom --no-owner --file="$backup" "$source_db"
          test -s "$backup"
          createdb "$restore_db"
          pg_restore --exit-on-error --no-owner --dbname="$restore_db" "$backup"
          VOICX_DATABASE_URL="postgres://voicx:voicx@localhost:5432/$restore_db?sslmode=disable" \
            go run ./cmd/migrate -timeout 2m
          source_ledger="$(psql --dbname="$source_db" --tuples-only --no-align \
            --command="SELECT filename || ':' || checksum FROM public.schema_migrations ORDER BY filename")"
          restore_ledger="$(psql --dbname="$restore_db" --tuples-only --no-align \
            --command="SELECT filename || ':' || checksum FROM public.schema_migrations ORDER BY filename")"
          test -n "$source_ledger"
          test "$source_ledger" = "$restore_ledger"

  security-gate:
    name: Security analysis
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  docker:
    needs: [proto-contract, test, frontend-e2e, security-gate]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: compute version metadata
        shell: bash
        run: go run ./cmd/version -check -format github >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && env.VOICX_PRERELEASE == 'false') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VOICX_VERSION=${{ env.VOICX_VERSION }}
            VOICX_COMMIT=${{ env.VOICX_COMMIT }}
            VOICX_DIRTY=${{ env.VOICX_DIRTY }}
            VOICX_BUILD_DATE=${{ env.VOICX_BUILD_DATE }}
            VOICX_UPDATE_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release-build:
    needs: [proto-contract, test, frontend-e2e, client-windows, security-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VOICX_UPDATE_PUBLIC_KEYS: ${{ vars.VOICX_UPDATE_PUBLIC_KEYS }}
      VOICX_UPDATE_REPO: ${{ github.repository }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: compute version metadata
        shell: bash
        run: go run ./cmd/version -check -format github >> "$GITHUB_ENV"

      - name: validate update public-key configuration
        shell: bash
        run: |
          test -n "$VOICX_UPDATE_PUBLIC_KEYS" || {
            echo "repository variable VOICX_UPDATE_PUBLIC_KEYS is required" >&2
            exit 1
          }

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: build client (windows/amd64)
        shell: bash
        working-directory: client
        run: |
          wails build -trimpath -ldflags "-s -w $VOICX_LDFLAGS \
            -X=voicx/internal/version.UpdateRepo=$VOICX_UPDATE_REPO \
            -X=voicx/internal/version.UpdatePublicKeys=$VOICX_UPDATE_PUBLIC_KEYS"

      - name: build server (linux/amd64)
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-s -w $VOICX_LDFLAGS \
              -X=voicx/internal/version.UpdateRepo=$VOICX_UPDATE_REPO" \
            -o voicx-server-linux-amd64 ./cmd/server

      - name: stage release binaries
        shell: bash
        run: |
          cp client/build/bin/voicx-client.exe voicx-client-windows-amd64.exe

      - name: attest release binary build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            voicx-client-windows-amd64.exe
            voicx-server-linux-amd64

      - name: upload release binaries for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            voicx-client-windows-amd64.exe
            voicx-server-linux-amd64
          if-no-files-found: error
          retention-days: 1

  release-sign:
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOICX_UPDATE_PUBLIC_KEYS: ${{ vars.VOICX_UPDATE_PUBLIC_KEYS }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release

      - name: create release manifest
        shell: bash
        run: |
          test -n "$VOICX_UPDATE_PUBLIC_KEYS" || {
            echo "repository variable VOICX_UPDATE_PUBLIC_KEYS is required" >&2
            exit 1
          }
          printf '# voicx-version: %s\n' "$GITHUB_REF_NAME" > release/checksums.txt
          sha256sum release/voicx-client-windows-amd64.exe release/voicx-server-linux-amd64 \
            | sed 's#  release/#  #' >> release/checksums.txt

      - name: build release signer
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/signrelease" ./cmd/signrelease

      - name: sign release manifest
        shell: bash
        env:
          VOICX_UPDATE_SIGNING_KEY: ${{ secrets.VOICX_UPDATE_SIGNING_KEY }}
        run: '"$RUNNER_TEMP/signrelease" -in release/checksums.txt -out release/checksums.txt.sig -version "$GITHUB_REF_NAME"'

      - name: verify signed release assets
        shell: bash
        run: |
          go run ./cmd/signrelease -verify -in release/checksums.txt \
            -out release/checksums.txt.sig -version "$GITHUB_REF_NAME"
          (
            cd release
            test "$(head -n 1 checksums.txt)" = "# voicx-version: $GITHUB_REF_NAME"
            test "$(tail -n +2 checksums.txt | wc -l)" -eq 2
            test "$(tail -n +2 checksums.txt | awk '{print $2}')" = "$(printf '%s\n%s' voicx-client-windows-amd64.exe voicx-server-linux-amd64)"
            tail -n +2 checksums.txt | sha256sum --check --strict
          )

      - name: upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 1

  release-publish:
    needs: release-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOICX_UPDATE_PUBLIC_KEYS: ${{ vars.VOICX_UPDATE_PUBLIC_KEYS }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: compute version metadata
        shell: bash
        run: go run ./cmd/version -check -format github >> "$GITHUB_ENV"

      - name: download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: verify signed release manifest
        shell: bash
        run: |
          go run ./cmd/signrelease -verify -in release/checksums.txt \
            -out release/checksums.txt.sig -version "$GITHUB_REF_NAME"
          (
            cd release
            test "$(head -n 1 checksums.txt)" = "# voicx-version: $GITHUB_REF_NAME"
            test "$(tail -n +2 checksums.txt | wc -l)" -eq 2
            test "$(tail -n +2 checksums.txt | awk '{print $2}')" = "$(printf '%s\n%s' voicx-client-windows-amd64.exe voicx-server-linux-amd64)"
            tail -n +2 checksums.txt | sha256sum --check --strict
          )

      - name: upload verified release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ env.VOICX_PRERELEASE == 'true' }}
          make_latest: ${{ env.VOICX_PRERELEASE == 'false' }}
          files: |
            release/voicx-client-windows-amd64.exe
            release/voicx-server-linux-amd64
            release/checksums.txt
            release/checksums.txt.sig
