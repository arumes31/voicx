name: CI

on:
  push:
  pull_request:

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicx
          POSTGRES_PASSWORD: voicx
          POSTGRES_DB: voicx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicx -d voicx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: install linux client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: build frontend assets
        working-directory: client/frontend
        run: |
          npm ci
          npm run build

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt issues in:"; echo "$fmt"; exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          (cd client && go vet ./...)

      - name: build
        run: |
          go build ./...
          (cd client && go build ./...)

      - name: test
        run: |
          go test ./... -race -count=1
          (cd client && go test ./...)
        env:
          VOICX_TEST_DATABASE_URL: postgres://voicx:voicx@localhost:5432/voicx?sslmode=disable
          VOICX_REDIS_ADDR: localhost:6379

  docker:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: compute version metadata
        shell: bash
        run: |
          echo "VOICX_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VOICX_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VOICX_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "VOICX_DIRTY=false" >> "$GITHUB_ENV"

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: build client (windows/amd64)
        shell: bash
        working-directory: client
        run: |
          wails build -ldflags "-s -w \
            -X voicx/internal/version.Version=${{ github.ref_name }} \
            -X voicx/internal/version.Build=${{ env.VOICX_BUILD }} \
            -X voicx/internal/version.Commit=${{ env.VOICX_COMMIT }} \
            -X voicx/internal/version.BuildDate=${{ env.VOICX_BUILD_DATE }} \
            -X voicx/internal/version.Dirty=${{ env.VOICX_DIRTY }} \
            -X voicx/internal/version.UpdateRepo=${{ github.repository }}"

      - name: build server (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X voicx/internal/version.Version=${{ github.ref_name }} \
              -X voicx/internal/version.Build=${{ env.VOICX_BUILD }} \
              -X voicx/internal/version.Commit=${{ env.VOICX_COMMIT }} \
              -X voicx/internal/version.BuildDate=${{ env.VOICX_BUILD_DATE }} \
              -X voicx/internal/version.Dirty=${{ env.VOICX_DIRTY }} \
              -X voicx/internal/version.UpdateRepo=${{ github.repository }}" \
            -o voicx-server-linux-amd64 ./cmd/server

      - name: checksums
        shell: bash
        run: |
          cp client/build/bin/voicx-client.exe voicx-client-windows-amd64.exe
          sha256sum voicx-client-windows-amd64.exe voicx-server-linux-amd64 > checksums.txt
          cat checksums.txt

      - name: upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            voicx-client-windows-amd64.exe
            voicx-server-linux-amd64
            checksums.txt
