<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voicx</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="details-collapsed">
    <!-- Login overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <h1 class="wordmark">voicx</h1>
            <p class="tagline">voice ops console</p>
            <label>SERVER <input id="login-addr" value="127.0.0.1:12333" /></label>
            <label>NICKNAME <input id="login-nick" placeholder="nickname or unique id" /></label>
            <label>PASSWORD <input id="login-password" type="password" placeholder="optional — account login" /></label>
            <label>SERVER PASSWORD <input id="login-serverpw" type="password" placeholder="if required" /></label>
            <button id="login-connect">CONNECT</button>
            <div id="login-error"></div>
            <div class="pane-head">RECENT SERVERS</div>
            <div id="login-recents"></div>
            <div class="identity-footnote">
                Identity auto-generated — stored locally
                <span class="mono" id="login-identity"></span>
                <span class="mono version-foot" id="login-version"></span>
            </div>
        </div>
    </div>

    <div id="toasts"></div>

    <!-- Main three-pane layout -->
    <div id="app" class="hidden">
        <nav id="menubar"></nav>
        <div id="server-tabs"></div>
        <div id="app-body">
        <aside id="sidebar">
            <div class="brand">
                <img id="server-icon" class="hidden" alt="" title="server icon" />
                <span class="wordmark">voicx</span>
                <span id="alpha-badge" title="alpha software — click for details">α</span>
                <span id="conn-lock" class="hidden" title="control channel TLS + chat payload encryption on">🔒</span>
                <button id="notif-bell" class="icon-btn" title="Notifications (346)" aria-label="notifications">🔔<span id="notif-badge" class="hidden"></span></button>
                <span id="conn-pill" class="pill">offline</span>
            </div>
            <div class="pane-head sidebar-head"><span>CHANNELS</span><button id="channel-create-btn" class="icon-btn pane-head-btn" title="Create channel">+</button></div>
            <div id="tree-tools">
                <input id="tree-filter" placeholder="filter… (319)" />
                <button id="tree-collapse" class="icon-btn" title="Collapse all (302)">▾</button>
                <button id="tree-expand" class="icon-btn" title="Expand all (302)">▸</button>
            </div>
            <div id="channel-tree"></div>
        </aside>

        <main id="center">
            <div id="center-tabs">
                <button id="tab-chat" class="active">Chat</button>
                <button id="tab-files">Files</button>
                <button id="tab-transfers" class="icon-btn" title="Transfers">⇅</button>
            </div>
            <div id="banner-box"></div>
            <div id="voice-bar">
                <button id="ptt-btn" title="Hold to talk (configure PTT in Settings)">🎙</button>
                <div class="voice-buttons">
                    <button id="voice-mute" class="icon-btn" title="Mute">🔇</button>
                    <button id="voice-prio" class="icon-btn" title="Priority speaker (duck others while you talk)">PRIO</button>
                    <button id="voice-video" class="icon-btn" title="Camera on/off">📷</button>
                    <button id="voice-screen" class="icon-btn" title="Share screen">🖥</button>
                    <button id="voice-lowbw" class="icon-btn" title="Low-bandwidth mode (receive low quality, send 150 kbps)">📶</button>
                </div>
                <div class="voice-info">
                    <div id="voice-status">voice off</div>
                    <div id="mic-status" class="warn"></div>
                    <div id="mic-meter" class="hidden"><div class="mic-fill cool"></div></div>
                </div>
                <span id="hotkey-status" title="global hotkey status"></span>
            </div>
            <div id="talk-banner" class="hidden">● TALKING</div>
            <div id="video-grid" class="hidden"></div>
            <div id="chat-head">
                <span id="chat-head-title">Chat</span>
                <span id="chat-topic" class="hidden" title=""></span>
                <span id="chat-slowmode" class="hidden" title=""></span>
                <span id="chat-head-actions">
                    <button id="chat-search-btn" class="icon-btn" title="Search chat (Ctrl+F)">🔍</button>
                    <button id="chat-pins-btn" class="icon-btn" title="Pinned messages">📌</button>
                    <button id="chat-info-btn" class="icon-btn hidden" title="Channel description">ⓘ</button>
                    <button id="chat-e2ee-btn" class="icon-btn" title="Encryption diagnostics">🔒</button>
                    <button id="chat-export-btn" class="icon-btn" title="Export the full stored history (not just what is loaded)">⬇</button>
                </span>
            </div>
            <div id="chat-search-row" class="hidden">
                <input id="chat-search" placeholder="filter loaded messages… (Esc closes)" />
                <button id="chat-search-server" title="Decrypt and scan the whole scope history in this client">search all history</button>
                <button id="chat-search-close" class="icon-btn" title="Close search">✕</button>
            </div>
            <div id="pm-tabs" class="hidden"></div>
            <div id="chat-wrap">
                <div id="chat-log"></div>
                <button id="chat-newpill" class="hidden"></button>
            </div>
            <div id="chat-typing" class="hidden"></div>
            <div id="reply-bar" class="hidden"></div>
            <div id="file-preview-row" class="hidden"></div>
            <div id="chat-input-row">
                <select id="chat-scope">
                    <option value="channel">channel</option>
                    <option value="global">global</option>
                    <option value="direct">direct</option>
                </select>
                <div id="chat-target-picker" class="hidden">
                    <input id="chat-target" placeholder="find connected member or enter UID" role="combobox" aria-label="Direct message recipient" aria-autocomplete="list" aria-expanded="false" aria-controls="chat-target-options" autocomplete="off" />
                    <button id="chat-target-toggle" type="button" aria-label="Show connected members" title="Show connected members">⌄</button>
                    <div id="chat-target-options" class="hidden" role="listbox"></div>
                </div>
                <input id="chat-text" placeholder="message…" />
                <input id="chat-file" type="file" multiple class="hidden" />
                <button id="chat-attach" class="icon-btn" title="Attach files (or paste / drop them here)">📎</button>
                <button id="chat-emoji" class="icon-btn" title="Emoji picker">😊</button>
                <button id="chat-send">SEND</button>
            </div>
            <div id="files-pane"></div>
            <video id="remote-video" autoplay playsinline class="hidden"></video>
            <video id="local-video" autoplay playsinline muted class="hidden"></video>
        </main>

        <aside id="details" aria-hidden="true">
            <div class="details-head">
                <div class="pane-head">DETAILS</div>
                <button id="details-close" class="icon-btn" title="Close details" aria-label="Close details">✕</button>
            </div>
            <div id="client-card"></div>
            <div class="pane-head">SERVER</div>
            <div id="news-area"></div>
            <div class="pane-head">PERMISSIONS</div>
            <div id="perm-area"></div>
        </aside>
        <button id="details-toggle" title="Open details" aria-label="Open details" aria-expanded="false">Details</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
