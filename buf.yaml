# buf.yaml configures the buf CLI for linting and breaking-change detection.
# See: https://buf.build/docs/configuration/v2/buf-yaml/
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # These are legacy contract names/locations. Buf's baseline granularity is
  # one rule/file pair, so keep every exception exact and every other
  # STANDARD rule enforced.
  disallow_comment_ignores: true
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - proto/chat.proto
      - proto/control.proto
      - proto/events.proto
      - proto/signaling.proto
    SERVICE_SUFFIX:
      - proto/chat.proto
      - proto/control.proto
      - proto/events.proto
      - proto/signaling.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/chat.proto
      - proto/signaling.proto
    RPC_REQUEST_STANDARD_NAME:
      - proto/events.proto
      - proto/signaling.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/chat.proto
      - proto/events.proto
      - proto/signaling.proto
  enum_zero_value_suffix: _UNSPECIFIED
breaking:
  use:
    - FILE
