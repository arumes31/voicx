syntax = "proto3";

package voicx.v1;

option go_package = "voicx/v1;voicxv1";

// Signaling service handles WebRTC negotiation between clients and the server.
// The server acts as a signaling relay and SFU controller.
service Signaling {
  // Bidirectional stream: clients send signaling messages and receive
  // signaling events (offers, answers, ICE candidates) from the server.
  rpc Signal(stream SignalMessage) returns (stream SignalMessage);
}

// SignalMessage is the envelope for all signaling payloads exchanged over the
// signaling stream. Exactly one payload field should be set per message.
message SignalMessage {
  string client_id = 1;
  string channel_id = 2;
  oneof payload {
    JoinChannel join_channel = 10;
    LeaveChannel leave_channel = 11;
    Subscribe subscribe = 12;
    Unsubscribe unsubscribe = 13;
    SdpOffer sdp_offer = 14;
    SdpAnswer sdp_answer = 15;
    IceCandidate ice_candidate = 16;
    Bye bye = 17;
  }
}

// JoinChannel requests membership in a channel for media exchange.
message JoinChannel {
  string channel_id = 1;
  // Capabilities advertised by the client (e.g. "opus", "vp8", "h264").
  repeated string capabilities = 2;
  // True if the client intends to publish media; false for subscribe-only.
  bool publish = 3;
}

// LeaveChannel relinquishes membership in a channel.
message LeaveChannel {
  string channel_id = 1;
  string reason = 2;
}

// Subscribe requests the server to forward media from a publisher.
message Subscribe {
  string channel_id = 1;
  // Publisher to subscribe to; empty means all publishers in the channel.
  string publisher_id = 2;
  repeated string media_types = 3; // e.g. ["audio", "video"]
}

// Unsubscribe stops a previously established subscription.
message Unsubscribe {
  string channel_id = 1;
  string publisher_id = 2;
}

// SdpOffer carries an SDP offer, typically from a client to the server.
message SdpOffer {
  string channel_id = 1;
  string publisher_id = 2;
  string sdp = 3;
  // Type of session: "publish" or "subscribe".
  string session_type = 4;
}

// SdpAnswer carries an SDP answer, typically from the server to a client.
message SdpAnswer {
  string channel_id = 1;
  string publisher_id = 2;
  string subscriber_id = 3;
  string sdp = 4;
  string session_type = 5;
}

// IceCandidate carries a single ICE candidate for trickle ICE.
message IceCandidate {
  string channel_id = 1;
  string publisher_id = 2;
  string subscriber_id = 3;
  string candidate = 4;
  string sdp_mid = 5;
  int32 sdp_mline_index = 6;
  // Direction: "offer" or "answer".
  string direction = 7;
}

// Bye signals graceful teardown of the signaling stream.
message Bye {
  string reason = 1;
}
