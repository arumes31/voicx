# docker-compose.yml — voicx full stack (Go server + PostgreSQL + Redis)
#
# Usage:
#   make compose-up   # build & start the whole stack detached
#   make compose-down # stop & remove containers/networks
#
# Services resolve each other by service name on the `voicx-net` bridge network
# (e.g. the Go server connects to `postgres:5432` and `redis:6379`).
#
# The voicx service is configured purely through VOICX_* environment variables
# below (no config file is mounted). Credentials/defaults can be overridden via
# a .env file (see .env.example).

services:
  # ---------------------------------------------------------------------------
  # voicx — the Go voice/video server
  # ---------------------------------------------------------------------------
  voicx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # .git is excluded from the docker context; inject version metadata
        # via build args (override in .env or use make docker-build).
        VOICX_VERSION: ${VOICX_VERSION:-0.0.0-dev}
        VOICX_BUILD: ${VOICX_BUILD:-0}
        VOICX_COMMIT: ${VOICX_COMMIT:-none}
        VOICX_DIRTY: ${VOICX_DIRTY:-false}
        VOICX_BUILD_DATE: ${VOICX_BUILD_DATE:-unknown}
        VOICX_UPDATE_REPO: ${VOICX_UPDATE_REPO:-voicx/voicx}
    image: voicx:latest
    container_name: voicx
    # --- GPU access for server-side hardware transcoding (optional) --------
    # Only needed when recording.video_args uses a hardware encoder. Uncomment
    # ONE of the variants below.
    #
    # Intel/AMD (VAAPI/QuickSync via DRI):
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA (NVENC; requires the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # --- Container hardening -------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - voicx-net
    ports:
      # TeamSpeak-style voice transport (UDP)
      - "12334:12334/udp"
      # TLS control channel
      - "12333:12333"
      # Raw ServerQuery is loopback-only inside the container by default.
      # Prefer SSH for remote administration. If raw remote access is
      # intentional, publish 12335 and set both VOICX_QUERY_ADDR=:12335 and
      # VOICX_QUERY_ALLOW_REMOTE=true.
      # - "12335:12335"
      # Preferred remote administration: enable Query SSH and publish 12339.
      # - "12339:12339"
      # File transfer
      - "12336:12336"
      # Health/readiness/metrics HTTP endpoint
      - "12337:12337"
    volumes:
      # Writable data (uploaded files, avatars, icons, recordings) so the
      # root filesystem can stay read-only.
      - voicxdata:/data
    environment:
      # --- Logging ---
      VOICX_LOG_LEVEL: ${VOICX_LOG_LEVEL:-info}
      VOICX_DEV_MODE: ${VOICX_DEV_MODE:-false}

      # --- Database (points at the postgres service) ---
      VOICX_DATABASE_URL: "postgres://${POSTGRES_USER:-voicx}:${POSTGRES_PASSWORD:-voicx}@postgres:5432/${POSTGRES_DB:-voicx}?sslmode=disable"
      VOICX_PII_KEY_FILE: "/data/keys/pii.key"

      # --- Redis (points at the redis service) ---
      VOICX_REDIS_ADDR: "redis:6379"
      VOICX_REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # --- Listen addresses (kept in sync with the published ports) ---
      VOICX_TCP_ADDR: ":12333"
      VOICX_UDP_ADDR: ":12334"
      # gRPC carries Basic credentials over plaintext and is loopback-only.
      VOICX_GRPC_ADDR: "127.0.0.1:12338"
      VOICX_HEALTH_ADDR: ":12337"
      VOICX_METRICS_ALLOW_REMOTE: ${VOICX_METRICS_ALLOW_REMOTE:-false}
      VOICX_QUERY_ADDR: ${VOICX_QUERY_ADDR:-127.0.0.1:12335}
      VOICX_QUERY_ALLOW_REMOTE: ${VOICX_QUERY_ALLOW_REMOTE:-false}
      VOICX_QUERY_SSH_ENABLED: ${VOICX_QUERY_SSH_ENABLED:-false}
      VOICX_QUERY_SSH_ADDR: ":12339"
      VOICX_QUERY_SSH_HOST_KEY: "/data/keys/query_ssh_host.key"
      VOICX_FILE_ADDR: ":12336"

      # --- Writable data on the named volume (read_only root fs) ---
      VOICX_FILE_ROOT: "/data/files"
      VOICX_RECORDING_DIR: "/data/recordings"
      # TLS cert persists on the volume (stable TOFU fingerprint across restarts)
      VOICX_TLS_DIR: "/data/tls"

      # --- TURN (optional; must match the coturn service, profile "turn") ---
      VOICX_TURN_SECRET: ${TURN_SECRET:-}
      VOICX_TURN_REALM: ${TURN_REALM:-voicx}
      # Comma-separated client URIs, e.g. turn:localhost:12340?transport=udp
      VOICX_TURN_URIS: ${VOICX_TURN_URIS:-}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:12337/healthz || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # postgres — primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
    container_name: voicx-postgres
    restart: unless-stopped
    networks:
      - voicx-net
    # Exposed only internally; the voicx service connects via `postgres:5432`.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicx}
      POSTGRES_DB: ${POSTGRES_DB:-voicx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voicx} -d ${POSTGRES_DB:-voicx}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nightly compressed dumps. Backups use a volume separate from pgdata and
  # are retained for seven days; set BACKUP_REMOTE for optional object upload.
  postgres-backup:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voicx-net
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-voicx}:${POSTGRES_PASSWORD:-voicx}@postgres:5432/${POSTGRES_DB:-voicx}?sslmode=disable"
      POSTGRES_DB: ${POSTGRES_DB:-voicx}
      BACKUP_DIR: /backups/postgres
      BACKUP_RETENTION_DAYS: 7
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - pgbackups:/backups
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ -n \"$$BACKUP_REMOTE\" ]; then apk add --no-cache rclone; fi; while true; do h=$$(date -u +%H); m=$$(date -u +%M); s=$$(date -u +%S); h=$${h#0}; m=$${m#0}; s=$${s#0}; now=$$((h * 3600 + m * 60 + s)); if [ $$now -lt 8100 ]; then delay=$$((8100 - now)); else delay=$$((86400 - now + 8100)); fi; sleep $$delay; /bin/sh /usr/local/bin/postgres-backup.sh; done"

  # ---------------------------------------------------------------------------
  # redis — cache / pub-sub / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
    container_name: voicx-redis
    restart: unless-stopped
    networks:
      - voicx-net
    # Exposed only internally; the voicx service connects via `redis:6379`.
    expose:
      - "6379"
    # Enable AOF persistence so cached/session state survives restarts.
    command: [ "redis-server", "--appendonly", "yes" ]
    # If a Redis password is desired, set REDIS_PASSWORD in .env and uncomment:
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # coturn — TURN server for NAT traversal (445/446; OPTIONAL profile)
  #
  # Only needed for clients behind restrictive NATs (symmetric NAT, corporate
  # firewalls blocking UDP). LAN / direct-WAN deployments can skip it.
  #
  # Start with:  TURN_SECRET=<random> TURN_EXTERNAL_IP=<public ip> \
  #                docker compose --profile turn up -d
  #
  # Uses coturn's REST API auth: voicx mints time-limited credentials from the
  # shared static auth secret (internal/turn) and delivers them to clients in
  # the auth response. TURN_SECRET must match VOICX_TURN_SECRET on the voicx
  # service; set BOTH in .env or neither side works (445). Also set on voicx
  # (comma-separated):
  #   VOICX_TURN_URIS=turn:<host>:12340?transport=udp,turn:<host>:12340?transport=tcp
  #
  # TURN_EXTERNAL_IP is REQUIRED for any client outside this host (445): on the
  # bridge network coturn discovers only its 172.x container address and would
  # advertise relay candidates no external client can reach, so relaying fails
  # even though the ports below are published. --external-ip keeps the binding
  # on 172.x but rewrites the ADVERTISED address to the public one. Leaving it
  # unset drops the flag, which is only correct for host-local testing.
  # (Alternative to --external-ip: network_mode: host, which also drops the
  # 101-port relay publish — but it cannot coexist with the voicx-net bridge.)
  # ---------------------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.17.0-r0@sha256:7df59bcd84800c3978da2dd0d7fb17a8179e77a8bf667f678813120a9f18b094
    container_name: voicx-coturn
    profiles: [ "turn" ]
    restart: unless-stopped
    networks:
      - voicx-net
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - ./scripts/coturn-entrypoint.sh:/usr/local/bin/voicx-coturn-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/usr/local/bin/voicx-coturn-entrypoint.sh" ]
    ports:
      - "12340:12340"
      - "12340:12340/udp"
      # Relay ports (must be reachable by clients; widen in production).
      - "12342-12366:12342-12366/udp"
      # TLS/DTLS listener; only publish it together with the cert block below.
      # - "12341:12341"
      # - "12341:12341/udp"
    # volumes:
    #   # TLS material for turns:/DTLS (see the cert flags below).
    #   - ./data/turn-certs:/etc/coturn/certs:ro
    command:
      - "--listening-port=12340"
      # turns: needs a real certificate for the TURN hostname, which this repo
      # cannot ship. TLS/DTLS is therefore OFF rather than advertised-but-broken
      # (445). To enable: put fullchain.pem/privkey.pem in ./data/turn-certs,
      # uncomment the volume and the 12341 ports above, drop the two --no-*
      # lines, and add
      #   --tls-listening-port=12341
      #   --cert=/etc/coturn/certs/fullchain.pem
      #   --pkey=/etc/coturn/certs/privkey.pem
      # then append turns:<host>:12341?transport=tcp to VOICX_TURN_URIS.
      - "--no-tls"
      - "--no-dtls"
      - "--realm=${TURN_REALM:-voicx}"
      - "--use-auth-secret"
      # Empty when TURN_EXTERNAL_IP is unset; coturn ignores the empty argument.
      - "${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}"
      - "--min-port=12342"
      - "--max-port=12366"
      - "--no-multicast-peers"
      - "--no-cli"
      # --log=stdout is ambiguous in coturn 4.16 and aborts startup with exit
      # 255 before any listener opens (445).
      - "--log-file=stdout"

  # Toxiproxy is used only by scripts/chaos-webrtc.sh. WebRTC is forced
  # through the TURN/TCP proxy because Toxiproxy intentionally supports TCP,
  # not UDP; this still exercises the SFU media path under latency, jitter and
  # periodic transport outages rather than merely perturbing signaling.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    container_name: voicx-toxiproxy
    profiles: [ "chaos-network" ]
    restart: "no"
    networks:
      - voicx-net
    ports:
      - "12365:8474"
      - "12366:12366"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  voicx-net:
    driver: bridge
    name: voicx-net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    name: voicx-pgdata
  pgbackups:
    name: voicx-pgbackups
  redisdata:
    name: voicx-redisdata
  voicxdata:
    name: voicx-data
